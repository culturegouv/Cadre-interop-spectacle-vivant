name: Retour d'implémentation
description: Vous avez passé un export réel dans le validateur et quelque chose a échoué
labels: ["retour terrain"]
body:
  - type: markdown
    attributes:
      value: |
        Il s’agit de la contribution la plus utile que vous puissiez apporter,
        dans la mesure où elle permet d’évaluer le cadre à partir de données réelles et de cas d’usage concrets,
         plutôt que sur la base d’exemples construits à des fins de validation.
  - type: input
    id: origine
    attributes:
      label: Origine des données
      description: Type d'outil, type de structure. Pas besoin de nommer si vous préférez
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Le message d'erreur obtenu
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce que vous pensiez produire de correct
    validations:
      required: false
